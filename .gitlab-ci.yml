include:
  - project: 'CalyxOS/ci-templates'
    file: '/.gerrit-ci-template.yml'

image: briar/ci-image-android:trixie

stages:
  - test
  - vote

test:
  stage: test
  extends: .gerrit_checkout
  script:
    - ./gradlew assemble check
  cache:
    # Use branch-scoped keys so caches are shared across commits on the same branch
    key: "${CI_PROJECT_PATH}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .gradle/wrapper
      - .gradle/caches
  artifacts:
    name: "${CI_PROJECT_PATH}_${CI_JOB_STAGE}_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHA}"
    paths:
      - installer/build/reports
      - updater/build/reports
      - installer/build/outputs/apk
      - updater/build/outputs/apk
      - installer/build/outputs/mapping
      - updater/build/outputs/mapping
    reports:
      junit:
        - installer/build/test-results/*/TEST-*.xml
        - updater/build/test-results/*/TEST-*.xml
    expire_in: 1 week
    when: always
